name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile mac_cleaner.py mac_cleaner_gui.py macos_trash.py scheduler.py test_mac_cleaner.py
      - run: python -m unittest -v
      - run: python -m pip install .
      - run: mac-cleaner --help

  build-package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install .[dev]
      - run: python -m build
